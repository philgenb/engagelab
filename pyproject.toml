[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engagelab"
version = "0.1.0"
description = "Multimodal recording and retrospective annotation for player engagement research."
requires-python = ">=3.11"
dependencies = ["pylsl>=1.17,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
screen = ["mss>=10,<11", "Pillow>=11,<13", "av>=15,<20"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
engagelab = "engagelab_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["pipeline/src", "backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a working liblsl installation and local network streams"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
